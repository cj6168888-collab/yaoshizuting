name: yszt-canary

services:
  mysql:
    image: mysql:8.0
    container_name: yszt-canary-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yaoshizuting
    volumes:
      - yszt_canary_mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./src/main/resources/docker-init/99_schema_baseline_patch.sql:/docker-entrypoint-initdb.d/99_schema_baseline_patch.sql:ro
      - ./src/main/resources/docker-init/100_campaign_tables.sql:/docker-entrypoint-initdb.d/100_campaign_tables.sql:ro
      - ./src/main/resources/docker-init/101_system_config_table.sql:/docker-entrypoint-initdb.d/101_system_config_table.sql:ro
      - ./src/main/resources/docker-init/102_support_message_table.sql:/docker-entrypoint-initdb.d/102_support_message_table.sql:ro
      - ./src/main/resources/docker-init/103_notification_table.sql:/docker-entrypoint-initdb.d/103_notification_table.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: yszt-canary-redis
    volumes:
      - yszt_canary_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yszt-canary-app
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_UPLOAD_ROOT: /app/uploads
    volumes:
      - yszt_canary_upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yszt-canary-frontend
    ports:
      - "${YSZT_CANARY_BIND:-127.0.0.1}:${YSZT_CANARY_PORT:-18080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"app\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

volumes:
  yszt_canary_mysql_data:
  yszt_canary_redis_data:
  yszt_canary_upload_data:
