server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: yaoshizuting-member
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/yaoshizuting?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  redisson:
    config: classpath:redisson.yaml

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yaoshizuting.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YWJlYzEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
  expiration: 604800000
  header: Authorization
  prefix: Bearer

payment:
  wechat:
    api-key: your-wechat-api-key-here
  alipay:
    public-key: your-alipay-public-key-here
  callback:
    allowed-ips: 127.0.0.1,::1

rate-limit:
  enabled: true
  default-limit: 100
  default-period: 60

logging:
  level:
    com.yaoshizuting: debug
    org.springframework.security: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  upload:
    root-path: ${APP_UPLOAD_ROOT:uploads}
    public-path: /uploads
    max-image-size: 5242880
