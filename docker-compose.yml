services:
  mysql:
    image: mysql:8.0
    container_name: yaoshizuting-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yaoshizuting
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - ./src/main/resources/docker-init/99_schema_baseline_patch.sql:/docker-entrypoint-initdb.d/99_schema_baseline_patch.sql
      - ./src/main/resources/docker-init/100_campaign_tables.sql:/docker-entrypoint-initdb.d/100_campaign_tables.sql
      - ./src/main/resources/docker-init/101_system_config_table.sql:/docker-entrypoint-initdb.d/101_system_config_table.sql
      - ./src/main/resources/docker-init/102_support_message_table.sql:/docker-entrypoint-initdb.d/102_support_message_table.sql
      - ./src/main/resources/docker-init/103_notification_table.sql:/docker-entrypoint-initdb.d/103_notification_table.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yaoshizuting-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yaoshizuting-app
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_UPLOAD_ROOT: /app/uploads
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yaoshizuting-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"app\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  upload_data:
