name: CI

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test
        run: mvn -B -ntp -DskipTests=false test

      - name: Generate coverage report
        run: mvn -B -ntp -DskipTests=true jacoco:report

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Run Checkstyle
        run: mvn -B -ntp -DskipTests=true checkstyle:check

      - name: Run PMD
        run: mvn -B -ntp -DskipTests=true pmd:check
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build H5 frontend
        working-directory: frontend
        run: npm run build

      - name: Build WeChat Mini Program
        working-directory: frontend
        run: npm run build:mp-weixin

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
