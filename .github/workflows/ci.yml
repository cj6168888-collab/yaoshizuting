name: CI

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp -DskipTests=false test

      - name: Run Checkstyle
        run: mvn -B -ntp -DskipTests=true checkstyle:check

      - name: Run PMD
        run: mvn -B -ntp -DskipTests=true pmd:check
        env:
          MAVEN_OPTS: -Xmx1024m
